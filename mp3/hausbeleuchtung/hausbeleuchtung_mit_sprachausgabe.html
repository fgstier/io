<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Programmieren RX480E-1A (1-Kanalempfänger) </title>
 
  <style>
.box {
    width: 280px;
    height: 30px;
    border: 1px solid #999;
    font-size: 18px;
    color: #1c87c9;
    background-color: #eee;
    border-radius: 5px;
    box-shadow: 4px 4px #ccc;
  }

/* background */
.gradient {
  background-image: linear-gradient(to right top, #d16ba5, #c777b9, #ba83ca, #aa8fd8, #9a9ae1, #8aa7ec, #79b3f4, #69bff8, #52cffe, #41dfff, #46eefa, #5ffbf1);
  -webkit-background-size: cover;
  -moz-background-size: cover;
  -o-background-size: cover;
  background-size: cover;
  background-attachment: fixed;
} 

label { display: inline-block; cursor: pointer; position: relative; padding-left: 28px; margin-right: 12px; font-size: 16px; line-height: 22px; font-weight: bold; }
input[type=radio], input[type=checkbox] { display: none; }
label:before { content: ''; display: inline-block; width: 20px; height: 20px; margin-right: 10px; position: absolute; left: 0; bottom: 1px; background-color: #1ABFE5; box-shadow: inset 0 2px 3px 0 #10758C; border-radius: 3px; }
input[type=checkbox]:checked + label:before { content: '\2713'; text-shadow: 1px 1px 1px #10758C; font-size: 24px; color: #f3f3f3; text-align: center; line-height: 24px; }

.Button4 { 
  box-shadow: 3px 4px 0px 0px #8a2a21; 
  background-color: #c62d1f; 
  border-radius: 18px; 
  border: 1px solid #d02718; 
  display: inline-block; 
  cursor: pointer; 
  color: #ffffff; 
  font-family: Arial; 
  font-size: 17px; 
  padding: 7px 25px; 
  text-decoration: none; 
  text-shadow: 0px 1px 0px #810e05; 
  margin: 5px; 
}
.Button4:hover { background-color: #f24437; }

.testbutton { 
  font-family: arial; 
  color: #14396A !important; 
  font-size: 14px; 
  text-shadow: 0px 1px 0px #7CACDE; 
  box-shadow: 0px 0px 28px #BEE2F9; 
  padding: 6px 17px; 
  border-radius: 27px; 
  border: 3px solid #3866A3; 
  background: #63B8EE; 
  text-decoration: none; 
  display: inline-block; 
  margin: 4px; 
}
.testbutton:hover {
  color: #14396A !important;
  background: grad;
  background: linear-gradient(top,  #468CCF,  #63B8EE);
  background: -ms-linear-gradient(top,  #468CCF,  #63B8EE);
  background: -webkit-gradient(linear, left top, left bottom, from(#468CCF), to(#63B8EE));
  background: -moz-linear-gradient(top,  #468CCF,  #63B8EE);
}

/* LED-Stile */
.led {
  width: 18px;
  height: 18px;
  border-radius: 50%; 
  background-color: #ccc;
  display: inline-block;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
}

.led.active {
  background-color: #00cc44;
  box-shadow: 0 0 8px #00ff55;
  animation: blinkAnimation 0.8s infinite alternate;
}

@keyframes blinkAnimation {
  0%% { opacity: 0.3; }
  100%% { opacity: 1; }
}

.row-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-top: 12px;
}


/* Die Box für die Bedienelemente */
.anzeige-box {
  max-width: 320px;
  margin: 15px auto;
  padding: 15px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  text-align: center;
}

.anzeige-box h3 {
  font-size: 16px;
  color: #333;
  margin-top: 0;
  margin-bottom: 10px;
  white-space: pre-line; /* Übernimmt Zeilenumbrüche im Text */
}


 </style>

  </head>


<body class="gradient">
  <center>
    <h2>Programmieren Soundausgabe über pwm /h2>


<!-- NEU: Debug- und Log-Fenster als eine einzige saubere Box -->
<div class="anzeige-box">
  <h3>Debug-Log / Konsole</h3>
  
  <!-- Eingabefeld & Senden -->
  <form id="cmdForm" style="margin-bottom: 10px;" onsubmit="sendForm(event);">
    CMD: <input name="name_Input_cmd" id="cmdInput" value="" class="css-input" type="text" maxlength="8" style="width: 120px;"> 
    <input class="Button4" style="padding: 4px 10px; font-size: 14px; margin: 0;" value="send" type="submit">
  </form>

  <!-- Steuertasten -->
  <div style="margin-bottom: 10px;">
    <button class="testbutton" style="padding: 4px 10px; margin: 2px;" onmousedown="send_button('clear');">clear</button>
    <button class="testbutton" style="padding: 4px 10px; margin: 2px;" onmousedown="send_button('reset');">reset</button>
    <button class="testbutton" style="padding: 4px 10px; margin: 2px;" onmousedown="mycopy();">copy</button>
  </div>

  <!-- Textarea -->
  <div>
    <textarea name="textbox" class="css-input3" id="story" readonly="readonly" rows="6" style="width: 90%%; max-width: 280px; overflow: auto; font-family: monospace; font-size: 12px; padding: 5px; border-radius: 6px; border: 1px solid #ccc;">no connected...</textarea>
  </div>
</div>

<!-- NEU: Live-Anzeige für den Funk-Button -->
    <div class="anzeige-box" style="border: 2px solid #1c87c9;">
      <h3>Funk-Signal (Sender aktiv)</h3>
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <div id="topLed" class="led"></div>
      </div>
    </div>


 <div class="anzeige-box">
  <h3>start wave Datei </h3>
  <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    <div id="led1" class="led"></div>
  </div>
  <div style="text-align: center; margin-top: 10px;">
    <button class="Button4" style="padding: 5px 15px; font-size: 14px;" onclick="startManuell('button_modus0', 'led1')">Start wave</button>
  </div>
</div>


 <div class="anzeige-box">
  <h3 style="white-space: pre-line;">Test-Modus PWM-Signal Ausgabe </h3>
  <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    <div id="led2" class="led"></div>
  </div>
  <div style="text-align: center; margin-top: 10px;">
    <button class="Button4" style="padding: 5px 15px; font-size: 14px;" onclick="startManuell('button_modus1', 'led2')">Start Modus 1</button>
  </div>
</div>

 <div class="anzeige-box">
  <h3 style="white-space: pre-line;">Test-Modus Sinus-Signal 1 KHz </h3>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    <div id="led3" class="led"></div>
  </div>
  <div style="text-align: center; margin-top: 10px;">
    <button class="Button4" style="padding: 5px 15px; font-size: 14px;" onclick="startManuell('button_modus2', 'led3')">Start Modus 2</button>
  </div>
</div>

  </center>

<script>

function sendForm(event) {
  event.preventDefault(); // Verhindert das Neuladen der Seite
  var val = document.getElementById('cmdInput').value;
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "/get?name_Input_cmd=" + encodeURIComponent(val), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      // Befehl wurde erfolgreich vom ESP empfangen
      console.log("Befehl gesendet: " + val);
    }
  };
  xhr.send();
}

setInterval(function() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "/get_log", true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      var responseText = xhr.responseText;
      var textarea = document.getElementById('story');
      
      // Nur aktualisieren, wenn auch wirklich etwas im Buffer steht
      if (responseText.length > 0) {
        if (textarea.value === "no connected...") {
          textarea.value = responseText;
        } else {
          // Entweder den kompletten Buffer synchron halten oder anhängen:
          textarea.value = responseText; 
        }
        // Automatisch nach unten scrollen, damit man immer die neuesten Logs sieht
        textarea.scrollTop = textarea.scrollHeight;
      }
    }
  };
  xhr.send();
}, 1000); // Jede Sekunde aktualisieren


function send_button(x)
{
var xhr = new XMLHttpRequest();
xhr.open("GET", "/" + x, true);
xhr.send();
}

function mycopy()
{
  var copyText = document.getElementById("story");
  copyText.select();
  copyText.setSelectionRange(0, 99999)
  document.execCommand("copy");
}

function checkStatus(route, ledId)
 {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/" + route, true);
      xhr.onload = function() {
        var led = document.getElementById(ledId);
        if (led) {
            if (xhr.responseText.trim() === "1") {
                led.classList.add('active');
            } else {
                led.classList.remove('active');
            }
        }
      };
      xhr.send();
    }

    function startManuell(route, ledId) {
      var led = document.getElementById(ledId);
      if (led) {
          led.classList.add('active');
      }
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/" + route, true);
      xhr.send();
    }

    setInterval(function() {
      fetch('/alive');
    }, 5000);

    setInterval(function() {
      // NEU: Pollt den Status des Empfängerausgangs für die obere LED
      checkStatus("status_rx", "topLed");
      checkStatus("status1", "led1");
      checkStatus("status2", "led2");
      checkStatus("status3", "led3");
    }, 200); // 200ms Intervall, damit der Tastendruck flüssig reagiert


  </script>


  </body>
</html>
