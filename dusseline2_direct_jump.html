<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARKUSNAT Direkt-Glossar // DUSSELINES ERBE</title>
    <style>
        body {
            font-family: "Courier New", Courier, Consolas, monospace;
            background: #000000; 
            color: #ffffff;
            line-height: 1.6; 
            font-size: 18px;
            padding: 20px; 
            margin: 0;
            padding-top: 80px; /* Platz für die feste Statusleiste oben */
        }

        /* Feste, unaufdringliche System-Leiste am oberen Rand */
        .system-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #111111;
            border-bottom: 2px solid #ff1111;
            padding: 10px 20px;
            box-sizing: border-box;
            z-index: 9999;
            font-size: 13px;
            color: #888888;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .system-status {
            color: #ff1111;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        .entry {
            margin-bottom: 40px;
            padding: 15px;
            border-left: 3px solid #333;
        }

        /* Hebt den Eintrag hervor, der über den Code (#L1, #L2) angesprungen wurde */
        .entry:target {
            border-left: 3px solid #ff1111;
            background: #0a0000;
        }

        .id { color: #ff1111; font-weight: bold; }
        .term { font-weight: bold; margin-left: 10px; color: #00ff00; }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="system-nav">
        <span>PROG: DUSSELINES_ERBE // GLOSSAR</span>
        <span class="system-status">ℹ OBEN LINKS BEENDEN DRÜCKEN</span>
    </div>

    <div id="L1" class="entry">
        <span class="id">#L1</span>
        <span class="term">Incomprehensibilitatem</span>
        <p>Das Unbegreifbare der Unverständlichkeit...</p>
    </div>

    <div id="L2" class="entry">
        <span class="id">#L2</span>
        <span class="term">Motus animi</span>
        <p>Eine breitseitige Streuung des Geistes...</p>
    </div>

</body>
</html>
