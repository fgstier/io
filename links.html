<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System-Weiterleitung</title>
</head>
<body style="background: #000; color: #ccc; font-family: sans-serif; text-align: center; padding-top: 20%;">

    <div id="status-message">
        <p>Verbindung zum Sektor-Zentral-Depot wird aufgebaut...</p>
        <p style="font-size: 0.8em; color: #555;">Sektor: <span id="sektor-id">Analyse...</span></p>
    </div>

    <script>
        // 1. Parameter isolieren
        const urlParams = new URLSearchParams(window.location.search);
        let buchKey = urlParams.get('buch');
        
        // Fallback für puren Text nach dem Fragezeichen (?duss2)
        if (!buchKey) {
            buchKey = window.location.search.substring(1).split('=')[0];
        }

        // 2. Text säubern
        if (buchKey) {
            buchKey = buchKey.trim().toLowerCase();
        }

        // Visuelle Bestätigung auf dem Display ausgeben
        document.getElementById('sektor-id').innerText = buchKey || "Kein Sektor übergeben";

        // 3. Logik-Weiche für die Ziel-URLs
        let zielUrl = "";

        switch(buchKey) {
            case "duss2":
                zielUrl = "https://amzn.eu/d/0fXVnUxw";
                break;
            case "compiler":
                zielUrl = "https://amzn.eu/d/0fiMECim";
                break;
            case "dusseline":
                zielUrl = "https://amzn.eu/d/4TqVMAw";
                break;
            case "segel":
                zielUrl = "https://amzn.eu/d/fBF2a4X";
                break;
            case "rattara":
                zielUrl = "https://amzn.eu/d/6QqjoCU";
                break;
            case "verursachung":
                zielUrl = "https://amzn.eu/d/2rTGehY";
                break;
            case "nord2":
                zielUrl = "https://amzn.eu/d/07lPWfsY";
                break;
            case "ratt2":
                zielUrl = "https://amzn.eu/d/0fXVnUxw";
                break;
            default:
                zielUrl = ""; // Unbekannter Code
        }

        // 4. Ausführung der Umleitung
        if (zielUrl !== "") {
            window.location.replace(zielUrl);
        } else {
            document.getElementById('status-message').innerHTML = `
                <h2 style="color: #ff1111;">SEKTOR-KONFLIKT</h2>
                <p>Der Code <strong>"${buchKey || 'LEER'}"</strong> existiert nicht im Basis-Bestand.</p>
            `;
        }
    </script>
</body>
</html>
