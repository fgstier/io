<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>System-Weiterleitung</title>
</head>
<body style="background: #000; color: #ccc; font-family: sans-serif; padding: 20px;">
    <script>
        // 1. Parameter aus der URL auslesen
        const urlParams = new URLSearchParams(window.location.search);
        const buchKey = urlParams.get('buch');

        // 2. Das zentrale Link-Verzeichnis (Hier trägt man später die echten URLs ein)
		// eine-domain.de/links.html?buch=nord2
        const linkVerzeichnis = {
            "almanach1": https://amzn.eu/d/07lPWfsY", 
            "duss2": "https://amzn.eu/d/07lPWfsY", // Wird später durch den echten Amazon-Link ersetzt
            "nord2": "https://amzn.eu/d/07lPWfsY"
        };

        // 3. Umleitung ausführen
        if (buchKey && linkVerzeichnis[buchKey]) {
            window.location.href = linkVerzeichnis[buchKey];
        } else {
            // Fallback, falls der Begriff nicht existiert
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
