<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loop: Bug: Dusseline // Scanner-Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, Consolas, monospace;
        }

        /* Live-Kamera-Stream füllt den ganzen Bildschirm */
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* YouTube Container (vollflächig über der Kamera) */
        #youtube-overlay-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            display: none;
            background: #000;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Transparentes AR-Overlay für die Text-Einblendungen */
        #overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4; /* Über dem Video-Overlay, damit das HUD lesbar bleibt */
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Das HUD-Interface */
        .hud-box {
            border: 1px solid #fff;
            background: rgba(0, 0, 0, 0.85); 
            color: #fff;
            padding: 18px;
            max-width: 90%;
            width: 420px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .hud-box.active {
            opacity: 1;
        }

        .hud-header {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.6);
            padding-bottom: 6px;
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 15px; 
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        #hud-body {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        .hud-footer {
            margin-top: 12px;
            padding-top: 4px;
            border-top: 1px dotted rgba(255, 255, 255, 0.2);
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
            display: block;
        }

        #status-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 5;
            color: #fff;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .blink {
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>

<body>

    <div id="status-bar">
        <span class="blink">●</span> SCANNER_MODE: ACTIVE // YT_STREAM_ON
    </div>

    <video id="video" autoplay playsinline muted></video>

    <div id="youtube-overlay-container">
        <iframe id="youtube-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div id="overlay-container">
        <div id="hud" class="hud-box">
            <div class="hud-header">
                <span id="hud-title">Target Found</span>
                <span>SYS_REC_06</span>
            </div>
            <div id="hud-body">
                Analyse läuft...
            </div>
            <div id="hud-footer" class="hud-footer">
                INDEX // PENDING
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const ytContainer = document.getElementById('youtube-overlay-container');
        const ytPlayer = document.getElementById('youtube-player');
        const hud = document.getElementById('hud');
        const hudTitle = document.getElementById('hud-title');
        const hudBody = document.getElementById('hud-body');
        const hudFooter = document.getElementById('hud-footer');

        let worker = null;
        let isProcessing = false;
        let clearOverlayTimeout = null;
        let currentAudio = null; 

        // Die Datenbank mit integrierten YouTube-Embed-IDs
        const database = {
            "zivilisations-maschine": {
                title: "⚠️ CRITICAL_FAILURE",
                text: "[Kultur-Abbau-Index: 98.4%]\nMenschliche Identität abgetreten.",
                index: "SYS_REF_001 // LOC_DRESDEN"
            },
            "aberglaube": {
                title: "[!] SYSTEM-DIAGNOSE",
                text: "WISSENSCHAFTLICHER_ABERGLAUBE\nOmniszenz-Modus vorgetäuscht.",
                index: "SYS_REF_002 // CORE_LOGIC"
            },
            "zensuren": {
                title: "🚫 FILTER_BLOCKED",
                text: "[Inhalt nach Novia-Dekret zensiert]\nFrequenz-Abweichung isoliert.",
                index: "SYS_REF_003 // NOVIA_LAW"
            },
            "idioten": {
                title: "> SCAN: DEFAULT_MODE",
                text: "Mensch reduziert auf Funktion:\n'Kapitalverursacher'.",
                index: "SYS_REF_004 // ASSET_ERR"
            },
            "dusseline": {
                title: "🤖 MATRIX_ERROR",
                text: "Entität ist reines Wort und Buchstabe.\nGEFANGEN IN ENDLOSEN FAKE.",
                index: "SYS_REF_005 // SYNTAX_LVL"
            },
            // YouTube-Video-Trigger: Verwendet die Video-ID am Ende der URL
            // Parameter &autoplay=1 startet das Video sofort im iframe
            "[core-detection_run_32]": {
                title: "🎬 YT_STREAM_LAUNCH",
                text: "Verbinde mit externem Video-Server...",
                index: "EXE_V_32 // YOUTUBE", 
                youtubeId: "JDB7QalzHfg" // Setzen Sie hier Ihre YouTube-Video-ID ein
            },
            // Lokaler Audio-Trigger
            "[core-sound_run_24]": {
                title: "🎵 AUDIO_STREAM_LAUNCH",
                text: "Initialisiere akustisches Signalfeld...",
                index: "EXE_A_24 // ASSETS",
                audio: "assets/sound_24.mp3" 
            }
        };

        async function startCamera() {
            const constraints = {
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            };
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                } catch (fallbackErr) {
                    alert("Kamera-Zugriff nicht verfügbar.");
                }
            }
        }

        async function initOCR() {
            try {
                worker = await Tesseract.createWorker('deu');
                video.addEventListener('play', () => {
                    setTimeout(scanLoop, 1000);
                });
            } catch (e) {
                console.error("OCR-Initialisierungsfehler:", e);
            }
        }

        async function scanLoop() {
            if (video.paused || video.ended) return;
            if (!isProcessing && worker && video.videoWidth > 0) {
                await captureAndScan();
            }
            setTimeout(scanLoop, 1000);
        }

        async function captureAndScan() {
            isProcessing = true;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const { data: { text } } = await worker.recognize(canvas);
                const normalizedText = text.toLowerCase();

                let found = false;
                for (const key in database) {
                    if (normalizedText.includes(key)) {
                        executeTrigger(database[key]);
                        found = true;
                        break;
                    }
                }

                if (!found && !clearOverlayTimeout) {
                    clearOverlayTimeout = setTimeout(() => {
                        hud.classList.remove('active');
                        // YouTube-Player stoppen und ausblenden bei Fokusverlust
                        ytContainer.style.display = "none";
                        ytPlayer.src = ""; 
                        clearOverlayTimeout = null;
                    }, 4000); 
                } else if (found && clearOverlayTimeout) {
                    clearTimeout(clearOverlayTimeout);
                    clearOverlayTimeout = null;
                }

            } catch (ocrError) {
                console.error("OCR Fehler:", ocrError);
            } finally {
                isProcessing = false;
            }
        }

        function executeTrigger(entry) {
            hudTitle.innerText = entry.title;
            hudBody.innerHTML = entry.text.replace(/\n/g, '<br>');
            hudFooter.innerText = entry.index;
            hud.classList.add('active');

            // Audio-Wiedergabe (lokal)
            if (entry.audio) {
                if (!currentAudio || currentAudio.src.indexOf(entry.audio) === -1) {
                    if (currentAudio) currentAudio.pause();
                    currentAudio = new Audio(entry.audio);
                    currentAudio.volume = 0.8;
                    currentAudio.play().catch(e => console.log("Audio blockiert:", e));
                }
            }

            // YouTube-Wiedergabe (extern über iframe)
            if (entry.youtubeId) {
                const targetUrl = `https://www.youtube.com/embed/${entry.youtubeId}?autoplay=1&mute=0&controls=1`;
                if (ytPlayer.src !== targetUrl) {
                    ytPlayer.src = targetUrl;
                    ytContainer.style.display = "block";
                }
            }
        }

        window.addEventListener('load', () => {
            startCamera();
            initOCR();
        });
    </script>
</body>

</html>
