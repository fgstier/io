<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loop: Bug: Dusseline // Scanner-Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            /* Ein sauberer Monospace-Stapel für Terminal-Ästhetik */
            font-family: 'Courier New', Courier, Consolas, monospace;
        }

        /* Live-Kamera-Stream füllt den ganzen Bildschirm */
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Transparentes AR-Overlay für die Text-Einblendungen */
        #overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Das HUD-Interface */
        .hud-box {
            border: 1px solid #fff;
            background: rgba(0, 0, 0, 0.85); /* Etwas dunkler für besseren Kontrast zur Realität */
            color: #fff;
            padding: 18px;
            max-width: 90%;
            width: 420px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .hud-box.active {
            opacity: 1;
        }

        /* Der Primär-Identifikator (Größer, Fett, Abgegrenzt) */
        .hud-header {
            border-bottom: 1px dashed rgba(255, 255, 255, 0.6);
            padding-bottom: 6px;
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 15px; 
            display: flex;
            justify-content: space-between;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        /* Der Datenstrom (Präzise, gut lesbar, klar strukturiert) */
        #hud-body {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Fußnummer / Index-Zeile am unteren Rand der Box */
        .hud-footer {
            margin-top: 12px;
            padding-top: 4px;
            border-top: 1px dotted rgba(255, 255, 255, 0.2);
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
            display: block;
        }

        /* Status-Indikator oben links */
        #status-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 3;
            color: #fff;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .blink {
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="status-bar">
        <span class="blink">●</span> SCANNER_MODE: ACTIVE // OCR_ONLY
    </div>

    <video id="video" autoplay playsinline muted></video>

    <div id="overlay-container">
        <div id="hud" class="hud-box">
            <div class="hud-header">
                <span id="hud-title">Target Found</span>
                <span>SYS_REC_06</span>
            </div>
            <div id="hud-body">
                Analyse läuft...
            </div>
            <div id="hud-footer" class="hud-footer">
                INDEX // PENDING
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const hud = document.getElementById('hud');
        const hudTitle = document.getElementById('hud-title');
        const hudBody = document.getElementById('hud-body');
        const hudFooter = document.getElementById('hud-footer');

        let worker = null;
        let isProcessing = false;
        let clearOverlayTimeout = null;

        // Erweiterte Datenbank mit spezifischen Fußnummern (Index)
        const database = {
            "zivilisations-maschine": {
                title: "⚠️ CRITICAL_FAILURE",
                text: "[Kultur-Abbau-Index: 98.4%]\nMenschliche Identität erfolgreich an den Code abgetreten.",
                index: "SYS_REF_001 // LOC_DRESDEN"
            },
            "aberglaube": {
                title: "[!] SYSTEM-DIAGNOSE",
                text: "WISSENSCHAFTLICHER_ABERGLAUBE\nOmniszenz-Modus vorgetäuscht.\nCausality_Execution: PENDING.",
                index: "SYS_REF_002 // CORE_LOGIC"
            },
            "zensuren": {
                title: "🚫 FILTER_BLOCKED",
                text: "[Inhalt nach Novia-Dekret zensiert]\nFrequenz-Abweichung isoliert.",
                index: "SYS_REF_003 // NOVIA_LAW"
            },
            "idioten": {
                title: "> SCAN: DEFAULT_MODE",
                text: "Mensch reduziert auf Funktion:\n'Kapitalverursacher'.\nDisplay-Diktat vollständig ausgeführt.",
                index: "SYS_REF_004 // ASSET_ERR"
            },
            "dusseline": {
                title: "🤖 MATRIX_ERROR",
                text: "Entität ist reines Wort und Buchstabe.\nGEFANGEN IN ENDLOSEN FAKE.",
                index: "SYS_REF_005 // SYNTAX_LVL"
            }
        };

        // 1. Kamera-Stream mit hoher HD-Auflösung anfordern
        async function startCamera() {
            const constraints = {
                video: { 
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                } catch (fallbackErr) {
                    alert("Kamera-Zugriff verweigert oder nicht verfügbar.");
                }
            }
        }

        // 2. OCR Engine im Hintergrund vorbereiten
        async function initOCR() {
            try {
                worker = await Tesseract.createWorker('deu');
                video.addEventListener('play', () => {
                    setTimeout(scanLoop, 1000);
                });
            } catch (e) {
                console.error("OCR-Initialisierungsfehler:", e);
            }
        }

        // 3. Der kontrollierte Takt-Loop
        async function scanLoop() {
            if (video.paused || video.ended) return;

            if (!isProcessing && worker && video.videoWidth > 0) {
                await captureAndScan();
            }

            setTimeout(scanLoop, 1000);
        }

        // 4. Frame abgreifen und nach Zielwörtern analysieren
        async function captureAndScan() {
            isProcessing = true;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const { data: { text } } = await worker.recognize(canvas);
                const normalizedText = text.toLowerCase();

                let found = false;
                for (const key in database) {
                    if (normalizedText.includes(key)) {
                        showOverlay(database[key].title, database[key].text, database[key].index);
                        found = true;
                        break;
                    }
                }

                if (!found && !clearOverlayTimeout) {
                    clearOverlayTimeout = setTimeout(() => {
                        hud.classList.remove('active');
                        clearOverlayTimeout = null;
                    }, 3000);
                } else if (found && clearOverlayTimeout) {
                    clearTimeout(clearOverlayTimeout);
                    clearOverlayTimeout = null;
                }

            } catch (ocrError) {
                console.error("OCR Fehler:", ocrError);
            } finally {
                isProcessing = false;
            }
        }

        // 5. Das Overlay inklusive Fußnummer auf dem Display anzeigen
        function showOverlay(title, text, index) {
            hudTitle.innerText = title;
            hudBody.innerHTML = text.replace(/\n/g, '<br>');
            hudFooter.innerText = index; // Setzt den spezifischen Index
            hud.classList.add('active');
        }

        window.addEventListener('load', () => {
            startCamera();
            initOCR();
        });
    </script>
</body>

</html>
