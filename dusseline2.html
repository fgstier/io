<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loop: Bug: Dusseline // Audio- & Code-Scanner</title>
    <!-- Tesseract.js für Texterkennung (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- ZXing für Data-Matrix- und QR-Code Erkennung -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        
        #video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #overlay-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        /* Das HUD-Interface für Text */
        .hud-box { border: 1px solid #fff; background: rgba(0, 0, 0, 0.85); color: #fff; padding: 15px; max-width: 90%; width: 400px; text-transform: uppercase; font-size: 13px; line-height: 1.5; letter-spacing: 1px; opacity: 0; transition: opacity 0.3s ease-in-out; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .hud-box.active { opacity: 1; }
        .hud-header { border-bottom: 1px dashed #fff; padding-bottom: 5px; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; }
        
        #status-bar { position: absolute; top: 15px; left: 15px; z-index: 3; color: #fff; font-size: 11px; background: rgba(0,0,0,0.5); padding: 5px 10px; border: 1px solid rgba(255,255,255,0.3); text-transform: uppercase; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="status-bar">
        <span class="blink">●</span> MATRIX_DECODER: HYBRID_AUDIO // ON
    </div>

    <!-- Live-Kamera-Stream -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Unsichtbares Audio-Element für MP3-Dateien vom Webserver -->
    <audio id="audio-player" preload="auto"></audio>

    <!-- Transparentes AR-Overlay für Text-HUD -->
    <div id="overlay-container">
        <div id="hud" class="hud-box">
            <div class="hud-header"><span id="hud-title">Target</span><span>SYS_REC_06</span></div>
            <div id="hud-body">Suche...</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const hud = document.getElementById('hud');
        const hudTitle = document.getElementById('hud-title');
        const hudBody = document.getElementById('hud-body');
        const audioPlayer = document.getElementById('audio-player');
        
        let ocrWorker = null;
        const codeReader = new ZXing.BrowserMultiFormatReader();
        let isProcessing = false;
        let clearTextTimeout = null;

        // Datenbank für Text-Trigger (OCR)
        const textDatabase = {
            "zivilisations-maschine": { title: "⚠️ CRITICAL_FAILURE", text: "[Kultur-Abbau-Index: 98.4%]\nMenschliche Identität an den Code abgetreten." },
            "dusseline": { title: "🤖 MATRIX_ERROR", text: "Entität ist reines Wort.\nGEFANGEN IM ENDLOSEN FAKE." }
        };

        // Datenbank für Data-Matrix-Inhalte
        const codeDatabase = {
            "sound_loop_01": { type: "audio", src: "https://fgstier.github.io/io/assets/sound1.mp3" },
            "sound_loop_02": { type: "audio", src: "https://fgstier.github.io/io/assets/sound2.mp3" }
        };

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false });
                video.srcObject = stream;
            } catch (err) {
                try { const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); video.srcObject = fallback; } catch (e) { alert("Kamera-Fehler"); }
            }
        }

        async function initScanner() {
            ocrWorker = await Tesseract.createWorker('deu');
            video.addEventListener('play', () => { setInterval(processFrame, 1000); });
        }

        async function processFrame() {
            if (isProcessing) return;
            isProcessing = true;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                // 1. SCHRITT: Data-Matrix auslesen
                try {
                    const codeResult = await codeReader.decodeFromCanvas(canvas);
                    const codeContent = codeResult.getText().trim(); 
                    const lowerContent = codeContent.toLowerCase();

                    console.log("Erkannter Code-Inhalt:", codeContent);

                    if (lowerContent.includes('http://') || lowerContent.includes('https://')) {
                        const urlStartIndex = lowerContent.indexOf('http');
                        const cleanUrl = codeContent.substring(urlStartIndex);
                        window.location.href = cleanUrl; 
                        return; 
                    }

                    if (codeDatabase[lowerContent] && codeDatabase[lowerContent].type === "audio") {
                        playInternalAudio(codeDatabase[lowerContent].src);
                        return; 
                    }
                } catch (e) { /* Kein Matrix-Code im Frame */ }

                // 2. SCHRITT: OCR-Texterkennung
                try {
                    const { data: { text } } = await ocrWorker.recognize(canvas);
                    const normalizedText = text.toLowerCase().trim();
                    let textFound = false;

                    for (const key in textDatabase) {
                        if (normalizedText.includes(key)) {
                            showText(textDatabase[key].title, textDatabase[key].text);
                            textFound = true;
                            break;
                        }
                    }

                    // Reset nur anfordern, wenn das HUD aktuell nicht durch einen Treffer aktiv gehalten wird
                    if (!textFound && !hud.classList.contains('active')) {
                        resetTextWithDelay();
                    }
                } catch (ocrError) { 
                    console.error("OCR Fehler:", ocrError); 
                }

            } finally {
                // Garantiert, dass der Scanner nach jedem Durchlauf IMMER wieder freigegeben wird
                isProcessing = false;
            }
        }

        // Freischaltung der Audio-Schnittstelle
        window.addEventListener('click', () => {
            audioPlayer.play().then(() => {
                audioPlayer.pause(); 
                console.log("Audio-Schnittstelle freigeschaltet.");
            }).catch(e => console.log("Freischaltung läuft..."));
        }, { once: true });

        function showText(title, text) {
            if (clearTextTimeout) clearTimeout(clearTextTimeout);
            hudTitle.innerText = title;
            hudBody.innerHTML = text.replace(/\n/g, '<br>');
            hud.classList.add('active');
            
            // Text bleibt für 6 Sekunden sichtbar und schließt sich dann automatisch
            clearTextTimeout = setTimeout(() => { 
                hud.classList.remove('active'); 
            }, 6000);
        }

        function playInternalAudio(src) {
            if (audioPlayer.src !== src) {
                audioPlayer.src = src;
                audioPlayer.load();
                audioPlayer.play().catch(e => console.log("Audio blockiert. Interaktion nötig."));
                showText("🔊 AUDIO_STREAM", "Frequenz-Signal wird wiedergegeben...");
            }
        }

        function resetTextWithDelay() {
            // Verhindert ein permanentes Überschreiben aktiver Anzeigen
            if (!clearTextTimeout && hud.classList.contains('active')) {
                clearTextTimeout = setTimeout(() => { hud.classList.remove('active'); }, 3000);
            }
        }

        window.addEventListener('load', () => { startCamera(); initScanner(); });
    </script>
</body>
</html>
