<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loop: Bug: Dusseline // Scanner-Interface & Diagnose</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        
        /* Das Scan-Element füllt den Hintergrund */
        #reader { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
        
        #overlay-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        
        .hud-box { border: 1px solid #fff; background: rgba(0, 0, 0, 0.85); color: #fff; padding: 15px; max-width: 90%; width: 420px; text-transform: uppercase; font-size: 12px; line-height: 1.5; letter-spacing: 1px; opacity: 1; transition: opacity 0.3s ease-in-out; box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .hud-header { border-bottom: 1px dashed #fff; padding-bottom: 5px; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; }
        
        #status-bar { position: absolute; top: 15px; left: 15px; z-index: 3; color: #fff; font-size: 11px; background: rgba(0, 0, 0, 0.7); padding: 5px 10px; border: 1px solid rgba(255, 255, 255, 0.3); text-transform: uppercase; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        .diag-text { color: #00ff00; font-size: 10px; margin-top: 5px; font-family: monospace; }
        .err-text { color: #ff3333; }
    </style>
</head>

<body>

    <div id="status-bar">
        <span class="blink">●</span> DIAGNOSE_MODE // ON
    </div>

    <div id="reader"></div>

    <div id="overlay-container">
        <div id="hud" class="hud-box">
            <div class="hud-header">
                <span id="hud-title">SYSTEM INIZIALISIERUNG</span>
                <span>DIAG_v3.0</span>
            </div>
            <div id="hud-body">
                Kamera-Sensoren werden gestartet...
            </div>
            <div id="hud-diagnostics" class="diag-text">
                Warte auf Video-Frame...
            </div>
        </div>
    </div>

<script>
        const hud = document.getElementById('hud');
        const hudTitle = document.getElementById('hud-title');
        const hudBody = document.getElementById('hud-body');
        const hudDiag = document.getElementById('hud-diagnostics');

        let ocrWorker = null;
        let html5QrcodeScanner = null;
        let isOcrProcessing = false;
        let clearOverlayTimeout = null;

        const database = {
            "zivilisations-maschine": { title: "⚠️ CRITICAL_FAILURE", text: "[Kultur-Abbau-Index: 98.4%]\nMenschliche Identität abgetreten." },
            "aberglaube": { title: "[!] SYSTEM-DIAGNOSE", text: "WISSENSCHAFTLICHER_ABERGLAUBE\nOmniszenz-Modus vorgetäuscht." },
            "zensuren": { title: "🚫 FILTER_BLOCKED", text: "[Inhalt nach Novia-Dekret zensiert]" },
            "idioten": { title: "> SCAN: DEFAULT_MODE", text: "Mensch reduziert auf Funktion:\n'Kapitalverursacher'." },
            "dusseline": { title: "🤖 MATRIX_ERROR", text: "Entität ist reines Wort und Buchstabe.\nGEFANGEN IM FAKE." }
        };

        async function initSystem() {
            updateDiag("Lade Analyse-Engines...");
            try {
                // Tesseract v5 initialisieren
                ocrWorker = await Tesseract.createWorker('deu');
                
                // HTML5-QRCode Core initialisieren (Versteckter Modus ohne Standard-UI)
                html5QrcodeScanner = new Html5Qrcode("reader");

                const config = {
                    fps: 15, // Ausbalancierte Framerate schont die CPU
                    qrbox: function(viewfinderWidth, viewfinderHeight) {
                        // Dynamischer Fokusbereich
                        return { width: viewfinderWidth * 0.8, height: viewfinderHeight * 0.8 };
                    },
                    aspectRatio: 1.777778, // 16:9 Erzwingung
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true // Nutzt Hardware-API falls doch verfügbar
                    }
                };

                updateDiag("Suche Kamera...");
                
                // Startet das Video-Streaming direkt über die Rückkamera
                await html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );

                updateDiag("System bereit. Fokussiere Code...");
                
                // OCR-Schleife parallel starten
                setInterval(runOcrFallback, 800);

            } catch (e) {
                updateDiag("Init-Fehler: " + e.message, true);
            }
        }

        // ZWEIG 1: Data-Matrix & QR-Erkennung (Läuft vollautomatisch im Hintergrund)
        function onScanSuccess(decodedText, decodedResult) {
            const content = decodedText.trim();
            console.log("💥 SIGNATUR ERKANNT:", content);
            
            if (content.toLowerCase().startsWith('http')) {
                updateDiag("Code isoliert: Leite weiter...");
                showOverlay("🔗 REDIRECT", "Synchronisation mit Ziel-Plattform läuft...\n" + content);
                
                // Scanner stoppen, um Speicher zu entlasten
                html5QrcodeScanner.stop().then(() => {
                    window.location.href = content;
                }).catch(() => {
                    window.location.href = content;
                });
            }
        }

        function onScanFailure(error) {
            // Verhindert Konsolen-Spam: html5-qrcode wirft im Suchmodus permanent Ausnahmen
            updateDiag("Data-Matrix: Suche Signatur...");
        }

        // ZWEIG 2: OCR-Texterkennung (Läuft über Canvas-Abgriff, wenn CPU frei ist)
        async function runOcrFallback() {
            if (isOcrProcessing || !ocrWorker) return;
            
            // Greife das aktuelle Video-Element ab, das von html5-qrcode erzeugt wurde
            const videoEl = document.querySelector("#reader video");
            if (!videoEl || videoEl.paused || videoEl.ended || videoEl.videoWidth === 0) return;

            isOcrProcessing = true;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = videoEl.videoWidth;
                canvas.height = videoEl.videoHeight;
                const ctx = canvas.getContext('2d');
                
                // Frame spiegeln/zeichnen und kontrastieren
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                ctx.filter = 'contrast(1.8) grayscale(1)';
                ctx.drawImage(canvas, 0, 0);

                const { data: { text } } = await ocrWorker.recognize(canvas);
                const normalizedText = text.toLowerCase().trim();
                
                if (normalizedText) {
                    console.log("OCR-Frequenzstrom:", normalizedText);
                    let found = false;
                    for (const key in database) {
                        if (normalizedText.includes(key)) {
                            showOverlay(database[key].title, database[key].text);
                            found = true;
                            break;
                        }
                    }

                    if (!found && !clearOverlayTimeout) {
                        clearOverlayTimeout = setTimeout(() => {
                            hudTitle.innerText = "MATRIX_SEARCH";
                            hudBody.innerText = "Bewege Code oder Trigger-Text in den Fokus.";
                            clearOverlayTimeout = null;
                        }, 3000);
                    } else if (found && clearOverlayTimeout) {
                        clearTimeout(clearOverlayTimeout);
                        clearOverlayTimeout = null;
                    }
                }
            } catch (ocrErr) {
                console.error("OCR-Fehler im Hintergrund:", ocrErr);
            } finally {
                isOcrProcessing = false;
            }
        }

        function showOverlay(title, text) {
            hudTitle.innerText = title;
            hudBody.innerHTML = text.replace(/\n/g, '<br>');
        }

        function updateDiag(msg, isError = false) {
            hudDiag.innerHTML = isError ? `<span class="err-text">⚠️ ${msg}</span>` : `> ${msg}`;
        }

        window.addEventListener('load', initSystem);
    </script>
</body>
</html>
