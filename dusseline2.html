<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loop: Bug: Dusseline // Native Scanner-Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        #overlay-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .hud-box { border: 1px solid #fff; background: rgba(0, 0, 0, 0.85); color: #fff; padding: 15px; max-width: 90%; width: 420px; text-transform: uppercase; font-size: 12px; line-height: 1.5; letter-spacing: 1px; }
        .hud-header { border-bottom: 1px dashed #fff; padding-bottom: 5px; margin-bottom: 8px; font-weight: bold; display: flex; justify-content: space-between; }
        #status-bar { position: absolute; top: 15px; left: 15px; z-index: 3; color: #fff; font-size: 11px; background: rgba(0, 0, 0, 0.7); padding: 5px 10px; border: 1px solid rgba(255, 255, 255, 0.3); text-transform: uppercase; }
        .diag-text { color: #00ff00; font-size: 10px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="status-bar">● HARDWARE_MODE // ACTIVE</div>
    <video id="video" autoplay playsinline muted></video>

    <div id="overlay-container">
        <div class="hud-box">
            <div class="hud-header">
                <span>SYSTEM STATUS</span>
                <span>NATIVE_v3.0</span>
            </div>
            <div id="hud-body">Fokussiere Data-Matrix-Code...</div>
            <div id="hud-diagnostics" class="diag-text">Initialisiere Kamera...</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const hudBody = document.getElementById('hud-body');
        const hudDiag = document.getElementById('hud-diagnostics');
        let barcodeDetector;

        async function startSystem() {
            // Prüfen, ob das Betriebssystem des Handys Data Matrix nativ unterstützt
            if ('BarcodeDetector' in window) {
                const formats = await BarcodeDetector.getSupportedFormats();
                if (formats.includes('data_matrix')) {
                    barcodeDetector = new BarcodeDetector({ formats: ['data_matrix'] });
                    hudDiag.innerText = "> Native Hardware-Engine aktiv.";
                }
            }

            if (!barcodeDetector) {
                hudDiag.innerText = "> Fehler: Native API nicht unterstützt. Fallback erforderlich.";
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                video.addEventListener('play', () => {
                    setInterval(nativeScan, 200); // Schneller, nativer Hardware-Scan alle 200ms
                });
            } catch (err) {
                hudDiag.innerText = "> Kamera-Fehler: " + err.message;
            }
        }

        async function nativeScan() {
            if (video.paused || video.ended) return;

            try {
                // Das Betriebssystem scannt den Video-Frame direkt im Grafikspeicher
                const barcodes = await barcodeDetector.detect(video);
                if (barcodes.length > 0) {
                    const content = barcodes[0].rawValue.trim();
                    if (content.toLowerCase().startsWith('http')) {
                        hudBody.innerText = "Code erkannt! Weiterleitung...";
                        window.location.href = content;
                    }
                } else {
                    hudDiag.innerText = "> Suche aktive Signatur...";
                }
            } catch (e) {
                console.error("Hardware-Scan-Fehler:", e);
            }
        }

        window.addEventListener('load', startSystem);
    </script>
</body>
</html>
